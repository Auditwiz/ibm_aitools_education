<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM AI Tools Learning Hub</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Gtvn4ZDRY9jx2U8WyHh8UQBt63qj/5NcDfAzHV9vbXTzvMrwqYaqkO6rjt4t4Iwf" crossorigin="anonymous">
  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js 4 (deferred) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js" defer></script>
  <!-- Bootstrap 5.3 JS (deferred) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- Application logic (deferred) -->
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Mobile toggle button -->
  <button id="sidebarToggle" class="btn btn--outline d-md-none position-fixed m-4" aria-label="Toggle navigation" style="z-index:1050">☰</button>

  <!-- App Wrapper -->
  <div id="app" class="d-flex">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar bg-dark text-white d-flex flex-column">
      <h2 class="sidebar-title mb-4 fw-semibold">IBM AI Curriculum</h2>
      <ul id="moduleList" class="list-unstyled flex-grow-1 d-flex flex-column gap-2" aria-label="Module navigation"></ul>
      <div class="mt-auto pt-3">
        <div class="small">Overall Progress</div>
        <div class="progress" style="height:8px;">
          <div id="globalProgressBar" class="progress-bar bg-success" style="width:0%"></div>
        </div>
        <div id="globalProgressText" class="mt-2 small" aria-live="polite">0%</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="mainContent" class="main-content flex-grow-1 p-4"></main>
  </div>
</body>
</html>
