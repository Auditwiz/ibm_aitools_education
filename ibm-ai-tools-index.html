<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM AI Tools Learning Hub</title>
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Custom JS -->
  <script src="app.js" defer></script>
</head>
<body class="d-flex">
  <!-- Sidebar -->
  <nav id="sidebar" class="bg-dark text-white p-3">
    <h4 class="text-center mb-4">IBM AI Curriculum</h4>
    <ul id="moduleList" class="nav nav-pills flex-column gap-2"></ul>
    <hr class="text-secondary">
    <div class="small text-center mb-2">Overall Progress</div>
    <div id="globalProgress" class="progress" style="height: 8px;">
      <div id="globalProgressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
    </div>
    <div id="globalProgressText" class="text-center mt-2 small">0%</div>
  </nav>

  <!-- Main content -->
  <main id="content" class="flex-fill p-4 overflow-auto">
    <!-- Dynamic module content rendered here -->
  </main>
</body>
</html>
